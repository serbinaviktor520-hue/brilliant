<html lang="uk">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Адмінка · Brilliant</title>
<link rel="icon" href="/favicon.ico">
<style>
@font-face{font-family:Manrope;font-weight:200 800;font-display:swap;src:url(/assets/fonts/manrope-cyrillic-wght-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Manrope;font-weight:200 800;font-display:swap;src:url(/assets/fonts/manrope-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* layout: dark top bar like the site header, list of entries on the left, editor on the right */
:root{--bg:#EBEBEB;--card:#FFFFFF;--ink:#0F0F0F;--mut:rgba(15,15,15,.55);--line:rgba(15,15,15,.1);--acc:#3D8BFF;--dark:#0F0F0F;--ok:#1E9E5A;--bad:#D93A3A;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Manrope,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-left));background:rgba(235,235,235,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.logo{display:inline-flex;align-items:center;gap:12px;justify-self:start;text-decoration:none;color:var(--ink)}
.logo i{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 10px;border-radius:9px;background:var(--dark)}
.logo img{height:26px;filter:brightness(0) invert(1)}
.logo b{font-size:15px;font-weight:600}
.tabs{display:flex;gap:5px;padding:5px;border-radius:12px;background:var(--dark)}
.tabs button{min-height:40px;padding:0 18px;border:0;border-radius:8px;background:transparent;color:rgba(255,255,255,.62);font-weight:500}
.tabs button[aria-selected=true]{background:rgba(255,255,255,.14);color:#fff}
.acts{justify-self:end;display:flex;align-items:center;gap:10px}
.st{font-size:13px;color:var(--mut);white-space:nowrap}
.st.dirty{color:var(--ink)}.st.dirty::before{content:"";display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:var(--acc);vertical-align:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-weight:600;text-decoration:none;color:var(--ink);transition:background .2s,color .2s,border-color .2s}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.pri:hover{background:var(--acc);border-color:var(--acc)}
.btn.pri:disabled{opacity:.45;cursor:default;background:var(--dark);border-color:var(--dark)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn.danger.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.wrap{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:20px;padding:12px max(16px,env(safe-area-inset-right)) 80px max(16px,env(safe-area-inset-left));max-width:1440px;margin:0 auto}
.side{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 92px);overflow:auto;padding-bottom:8px}
.side h2,.ed h2{margin:6px 0 4px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.item{display:grid;grid-template-columns:auto 64px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px;border-radius:16px;background:var(--card);border:1px solid transparent;cursor:pointer;transition:border-color .15s}
.item:hover{border-color:var(--line)}
.item[aria-current=true]{border-color:var(--ink)}
.item.drag{opacity:.4}.item.over{border-color:var(--acc);border-style:dashed}
.grip{width:18px;height:28px;border:0;background:radial-gradient(circle,var(--mut) 1.3px,transparent 1.6px) 0 0/6px 7px;opacity:.6;cursor:grab}
.item img,.item .ph{width:64px;height:40px;border-radius:7px;object-fit:cover;background:#D9DDE5;display:block}
.item b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.chip{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:rgba(15,15,15,.06);color:var(--mut)}
.chip.on{background:rgba(61,139,255,.14);color:#1F5FD0}
.mv{display:flex;flex-direction:column;gap:2px}
.mv button{width:26px;height:20px;border:0;border-radius:5px;background:transparent;color:var(--mut);font-size:12px}
.mv button:hover{background:rgba(15,15,15,.06);color:var(--ink)}
.add{min-height:52px;border:1px dashed rgba(15,15,15,.25);border-radius:16px;background:transparent;font-weight:600;color:var(--mut)}
.add:hover{border-color:var(--ink);color:var(--ink)}
.ed{display:flex;flex-direction:column;gap:16px;min-width:0}
.sec{padding:24px;border-radius:24px;background:var(--card)}
.sec>h3{margin:0 0 4px;font-size:20px;font-weight:600;letter-spacing:-.02em}
.sec>p.hint{margin:0 0 18px;color:var(--mut);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.full{grid-column:1/-1}
.f label,.f .lb{font-size:13px;font-weight:600}
.f small{color:var(--mut);font-size:12px}
input[type=text],input[type=url],input[type=password],select,textarea{width:100%;min-height:44px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#F6F6F6;transition:border-color .15s,background .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);background:#fff}
textarea{min-height:92px;resize:vertical;line-height:1.45}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px;border-radius:14px;background:#F6F6F6}
.sw span b{display:block;font-weight:600}.sw span small{color:var(--mut);font-size:12px}
.sw input{appearance:none;-webkit-appearance:none;flex:none;width:44px;height:26px;border-radius:999px;background:rgba(15,15,15,.18);position:relative;cursor:pointer;transition:background .2s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.sw input:checked{background:var(--acc)}.sw input:checked::after{transform:translateX(18px)}
.sws{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.img{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px;align-items:center}
.img .pv{position:relative;width:200px;border-radius:14px;overflow:hidden;background:#D9DDE5 repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 8px,transparent 8px 16px)}
.img .pv img{display:block;width:100%;height:100%;object-fit:cover}
.img .pv.round{width:96px;height:96px;border-radius:50%}
.img:has(.round){grid-template-columns:96px minmax(0,1fr)}
.img .pv em{position:absolute;left:8px;top:8px;font-style:normal;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--acc);color:#fff}
.img .ctl{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:6px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:#F6F6F6}
.tags span{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:13px}
.tags span button{border:0;background:transparent;color:var(--mut);padding:0 2px;font-size:15px;line-height:1}
.tags input{flex:1;min-width:120px;min-height:30px;border:0;background:transparent;padding:4px}
.tags input:focus{background:transparent}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.head h1{margin:0;font-size:clamp(28px,3.4vw,44px);font-weight:600;letter-spacing:-.04em;line-height:1}
.prev{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.prev figure{margin:0}
.prev figcaption{margin-top:8px;font-size:12px;color:var(--mut)}
.prev .box{border-radius:14px;overflow:hidden;background:#0F0F0F;color:#fff}
.rv{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:start}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;max-width:min(560px,calc(100vw - 32px));padding:14px 18px;border-radius:14px;background:var(--dark);color:#fff;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast.bad{background:var(--bad)}
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login form{width:min(420px,100%);padding:32px;border-radius:24px;background:var(--card);display:flex;flex-direction:column;gap:14px}
.login h1{margin:8px 0 0;font-size:32px;letter-spacing:-.04em;line-height:1}
.login p{margin:0;color:var(--mut)}
.err{color:var(--bad);font-size:14px;min-height:20px}
.empty{padding:60px 24px;text-align:center;color:var(--mut)}
/* pages editor + live previews */
.seg{display:inline-flex;gap:3px;padding:3px;border-radius:10px;background:rgba(15,15,15,.07)}
.seg button{min-height:34px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:var(--mut);font-size:13px;font-weight:600;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pgw{display:grid;grid-template-columns:minmax(240px,280px) minmax(0,1fr);gap:20px;padding:12px max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left));height:calc(100vh - 64px);min-height:560px}
.pgw .side{position:static;max-height:none;height:100%}
.pg{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid transparent;background:var(--card)}
.pg b{font-weight:600}.pg small{color:var(--mut);font-size:12px}
.pg:hover{border-color:var(--line)}.pg[aria-current=true]{border-color:var(--ink)}
.howto{margin-top:6px;padding:14px;border-radius:14px;background:rgba(61,139,255,.08);font-size:13px;line-height:1.5}
.howto p{margin:0 0 6px}.howto p:last-child{margin:0}
.chg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;padding:10px 12px;border-radius:12px;background:var(--card);font-size:13px}
.chg s{color:var(--mut);text-decoration-thickness:1px}.chg span{display:block;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chg em{font-style:normal;font-size:11px;font-weight:600;color:#1F5FD0}
.chg button{width:28px;height:28px;border:0;border-radius:7px;background:transparent;color:var(--mut);font-size:16px}
.chg button:hover{background:rgba(15,15,15,.06);color:var(--ink)}
.stage{display:flex;flex-direction:column;min-height:0;border-radius:24px;background:var(--card);overflow:hidden}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}
.bar .grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar small{color:var(--mut);font-size:12px}
.frame{position:relative;flex:1;min-height:0;overflow:hidden;background:#D9DDE5}
.frame iframe{position:absolute;top:0;left:0;border:0;background:#fff;transform-origin:0 0;transition:opacity .25s}
.frame.mob iframe{box-shadow:0 0 0 1px rgba(15,15,15,.12),0 20px 50px rgba(0,0,0,.15)}
.frame .ld{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-size:14px;pointer-events:none}
.wrap.wp{grid-template-columns:minmax(260px,300px) minmax(0,1fr) minmax(0,1.05fr);max-width:none}
.pvw{position:sticky;top:76px;align-self:start;height:calc(100vh - 92px);min-height:480px}
.pvw .stage{height:100%}
details.old{margin-top:8px}
details.old summary{cursor:pointer;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:6px 0;list-style:none}
details.old summary::-webkit-details-marker{display:none}
details.old summary::after{content:" ▾";letter-spacing:0}
details.old[open] summary::after{content:" ▴"}
details.old .chg{margin-top:8px}
.chg .back{font-size:15px}
.chg .rv-l{font-size:11px;font-weight:600;color:#1F5FD0;white-space:nowrap;padding-top:6px}
.set{max-width:920px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right)) 80px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px}
.cnt{font-size:12px;color:var(--mut);font-weight:500}.cnt.over{color:var(--bad)}
.lbl{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.serp{margin-top:6px;padding:16px 18px;border-radius:14px;border:1px solid var(--line);background:#fff;font-family:Arial,system-ui,sans-serif}
.serp small{display:block;font-size:12px;color:#4D5156}
.serp b{display:block;margin:4px 0 3px;font-size:19px;font-weight:400;line-height:1.3;color:#1A0DAB;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.serp p{margin:0;font-size:14px;line-height:1.55;color:#4D5156;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(15,15,15,.45)}
.modal .box{width:min(620px,100%);max-height:min(720px,calc(100vh - 32px));display:flex;flex-direction:column;border-radius:24px;background:var(--card);overflow:hidden}
.modal .mh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 22px 12px}
.modal .mh h3{margin:0;font-size:22px;letter-spacing:-.02em}
.modal .mh p{margin:4px 0 0;color:var(--mut);font-size:13px}
.modal .ml{overflow:auto;padding:4px 14px 18px;display:flex;flex-direction:column;gap:6px}
.ver{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:14px;background:#F6F6F6}
.ver b{display:block;font-size:14px;font-weight:600}.ver small{color:var(--mut);font-size:12px}
.ver.now{background:rgba(61,139,255,.1)}
.x{width:36px;height:36px;border:0;border-radius:9px;background:rgba(15,15,15,.06);font-size:18px}
@media (max-width:1280px){.wrap.wp{grid-template-columns:minmax(260px,300px) minmax(0,1fr)}.pvw{grid-column:1/-1;position:static;height:80vh}}
@media (max-width:980px){.pgw{grid-template-columns:1fr;height:auto}.pgw .stage{height:80vh}.wrap.wp{grid-template-columns:1fr}}
@media (max-width:980px){.wrap{grid-template-columns:1fr}.side{position:static;max-height:none}.top{grid-template-columns:1fr auto}.tabs{grid-column:1/-1;grid-row:2;justify-self:start}.grid2,.sws{grid-template-columns:1fr}.img{grid-template-columns:1fr}.prev{grid-template-columns:1fr}.st{display:none}}
@media (max-width:980px){.pgw .side{flex-direction:row;flex-wrap:wrap;gap:6px;overflow:visible}.pgw .side>h2{width:100%}.pg{width:auto;padding:8px 14px;border-radius:999px}.pg small{display:none}.pgw .howto{display:none}#chg{width:100%}}
@media (max-width:640px){.logo b,.acts a.btn{display:none}.acts{gap:6px}.acts .btn{min-height:40px;padding:0 12px}.tabs{width:100%;justify-content:space-between}.tabs button{padding:0 10px;flex:1}.top{padding:8px 12px}.wrap,.set{padding-left:12px;padding-right:12px}.sec{padding:18px;border-radius:20px}.modal .box{border-radius:20px}.bar{gap:6px}.bar small{display:none}}

<body>
<div id="login" class="login" hidden>
  <form id="lf">
    <span class="logo"><i><img src="/assets/logo.png" alt=""></i></span>
    <h1>Адмінка</h1>
    <p>Тексти, фото, посилання, проєкти, відгуки й SEO на vbrilliant.com.</p>
    <div class="f"><label for="pw">Пароль</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <div class="err" id="lerr"></div>
    <button class="btn pri" type="submit">Увійти</button>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <a class="logo" href="/" target="_blank" rel="noopener"><i><img src="/assets/logo.png" alt="Brilliant"></i><b>Адмінка</b></a>
    <div class="tabs" role="tablist">
      <button role="tab" id="t-pages" aria-selected="true">Сторінки</button>
      <button role="tab" id="t-projects" aria-selected="false">Проєкти</button>
      <button role="tab" id="t-reviews" aria-selected="false">Відгуки</button>
      <button role="tab" id="t-settings" aria-selected="false">SEO</button>
    </div>
    <div class="acts">
      <span class="st" id="st">Усе збережено</span>
      <button class="btn ghost sm" id="hist" type="button" title="Попередні версії сайту">Історія</button>
      <a class="btn ghost sm" href="/" target="_blank" rel="noopener">Сайт ↗</a>
      <button class="btn pri" id="pub" disabled>Опублікувати</button>
    </div>
  </header>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script type="module">
import * as core from '/cms/core.mjs';
{
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const k in attrs) { const v = attrs[k]; if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (v === true) e.setAttribute(k, ''); else if (v !== false && v != null) e.setAttribute(k, v); } for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c)); return e; };
const CATS = { re: 'Нерухомість', ag: 'Агенції', br: 'Бренди', art: 'Арт' };
const store = { get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} } };

let pass = store.get('bl-admin') || '', site = null, saved = '', tab = 'pages', cur = 0, busy = false;
let pageId = 'home', mode = 'edit', view = innerWidth < 700 ? 'mob' : 'desk', savedEdits = 0, pvPage = null;
const pending = new Map(); // path -> {base64, url}

// ---------- utils ----------
const slug = (s) => (s || 'img').toLowerCase().normalize('NFKD').replace(/[^\w\s-]/g, '').replace(/[\s_]+/g, '-').replace(/[^a-z0-9-]/g, '').replace(/-+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'img';
const tr = (s) => { const m = { а:'a',б:'b',в:'v',г:'h',ґ:'g',д:'d',е:'e',є:'ye',ж:'zh',з:'z',и:'y',і:'i',ї:'yi',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'kh',ц:'ts',ч:'ch',ш:'sh',щ:'shch',ь:'',ю:'yu',я:'ya' }; return String(s || '').toLowerCase().split('').map((c) => (m[c] ?? c)).join(''); };
const src = (p) => (!p ? '' : pending.has(p) ? pending.get(p).url : '/' + p.replace(/^\//, ''));
const blobPath = new Map(); // blob url -> uploads/… path
const recent = new Map(); // just-published photos, shown from memory until the deploy is live
const dirty = () => JSON.stringify(site) !== saved || pending.size > 0;
function mark() { if (tab === 'projects' || tab === 'reviews') schedulePreview(); const d = dirty(); const st = $('#st'); st.textContent = d ? 'Є неопубліковані зміни' : 'Усе збережено'; st.classList.toggle('dirty', d); $('#pub').disabled = !d || busy; }
let tt = 0; function toast(msg, bad) { const t = $('#toast'); t.textContent = msg; t.classList.toggle('bad', !!bad); t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, bad ? 7000 : 4500); }
addEventListener('beforeunload', (e) => { if (site && dirty()) { e.preventDefault(); e.returnValue = ''; } });

async function resize(file, kind) {
  const conf = { wide: [1800, 0], card: [900, 0], case: [1200, 0], avatar: [200, 200], page: [2000, 0] }[kind];
  const bmp = await createImageBitmap(file);
  let [w, h] = conf, sx = 0, sy = 0, sw = bmp.width, sh = bmp.height;

// ---------- live preview engine ----------
// Pages are built in the browser with the same code as the deploy (cms/core.mjs) and shown from blob: URLs,
// so the preview is exactly what «Опублікувати» will put on the site.
const PG = Object.fromEntries(core.PAGES.map((p) => [p.id, p]));

const srcCache = {}, builtCache = {};
function sources(id) {
  if (!srcCache[id]) {
    const pg = PG[id];
    const get = async (u) => { const r = await fetch(u + (u.includes('?') ? '&' : '?') + 'cms=' + Date.now(), { cache: 'no-store' }); if (!r.ok) throw new Error(String(r.status)); return r.text(); };
    // originals (before any edits) are kept in /cms/src by the build, so removed edits disappear from the preview too
    const one = (f, live) => get('/cms/src/' + f).catch(() => get(live));
    srcCache[id] = Promise.all([one(pg.html, urlOf(pg.html)), pg.js ? one(pg.js, '/' + pg.js) : Promise.resolve('')]).catch((e) => { delete srcCache[id]; throw e; });
  }
  return srcCache[id];
}
const withBlobs = (s) => { for (const [p, v] of [...recent, ...pending]) s = s.split('/' + p).join(v.url).split(p).join(v.url); return s; };
async function docUrl(id) {
  const [h0, j0] = await sources(id);
  const b = core.makeBuilder(site, () => false, { analytics: false });
  let h = b(h0, false, id), j = j0 ? b(j0, true, id) : '';
  builtCache[id] = [h, j];
  h = withBlobs(h); j = withBlobs(j);
  const urls = [];
  const pg = PG[id];
  if (pg.js) {
    const ju = URL.createObjectURL(new Blob([j], { type: 'text/javascript' })); urls.push(ju);
    h = h.replace(new RegExp(`src="/?${pg.js.replace(/\./g, '\\.')}(\\?v=[^"]*)?"`), `src="${ju}"`);
  }
  h = h.replace(/<head([^>]*)>/i, `<head$1><base href="${location.origin}/">`);
  const u = URL.createObjectURL(new Blob([h], { type: 'text/html' })); urls.push(u);
  return { url: u, urls };
}

// a box that holds the page iframe: desktop pages are rendered 1440 px wide and scaled to fit, phone is 390 px

    for (const f of this.host.querySelectorAll('iframe')) {

      f.style.height = (mob ? Math.min(844, (H - 24) / s) : H / s) + 'px';
      f.style.transform = `scale(${s})`;

    if (my !== this.seq) { d.urls.forEach((u) => URL.revokeObjectURL(u)); return; }
    const f = document.createElement('iframe');

    this.host.append(f); this.fit();
    await new Promise((r) => { f.addEventListener('load', r, { once: true }); f.src = d.url; });
    await new Promise((r) => setTimeout(r, 650));
    if (my !== this.seq) { this.drop(f); return; }

  drop(f) { (f._urls || []).forEach((u) => URL.revokeObjectURL(u)); f.remove(); }

}

      el('div', { class: 'grp' }, el('small', {}, 'Оновлюється, поки ви пишете'), seg([['desk', 'Компʼютер'], ['mob', 'Телефон']], view, (v) => { view = v; render(); }))),
    frame));
  queueMicrotask(() => { stage = new Stage(frame); stage.setView(view); schedulePreview(true); });
  return pane;
}

function render() {
  const main = $('#main');
  if (stage) { stage.destroy(); stage = null; }
  if (tab === 'pages') { renderPages(main); return; }
  if (tab === 'settings') { renderSettings(main); return; }
  const list = tab === 'projects' ? site.projects : site.reviews;
  if (cur >= list.length) cur = Math.max(0, list.length - 1);
  main.className = 'wrap wp';
  main.replaceChildren(el('aside', { class: 'side' }), el('div', { class: 'ed' }), previewPane());
  renderSide();
  if (!list.length) { $('.ed').append(el('div', { class: 'sec empty' }, 'Поки порожньо. Додайте перший запис зліва.')); return; }
  if (tab === 'projects') projectEditor(list[cur]); else reviewEditor(list[cur]);
}
const TABS = [['#t-pages', 'pages'], ['#t-projects', 'projects'], ['#t-reviews', 'reviews'], ['#t-settings', 'settings']];
function syncTabs() { for (const [id, t] of TABS) $(id).setAttribute('aria-selected', String(t === tab)); }
for (const [id, t] of TABS) $(id).addEventListener('click', () => { if (tab === t) return; tab = t; cur = 0; pvPage = null; syncTabs(); render(); });

// ---------- SEO: title & description of each page, as Google shows them ----------
function renderSettings(main) {
  main.className = 'set';
  const pages = core.PAGES.filter((p) => p.id !== '404');
  const secs = pages.map((pg) => {
    const box = el('section', { class: 'sec' }, el('h3', {}, pg.title), el('p', { class: 'hint' }, 'vbrilliant.com' + urlOf(pg.html)), el('div', { class: 'empty', style: 'padding:20px' }, 'Завантажую…'));
    sources(pg.id).then(([h]) => {
      const orig = core.readSeo(h);
      const cur = () => (site.seo || {})[pg.id] || {};
      const val = (k) => (cur()[k] != null ? cur()[k] : orig[k]);
      const set = (k, v) => { site.seo = site.seo || {}; const m = { ...cur(), [k]: v }; if ((m.title ?? orig.title) === orig.title && (m.description ?? orig.description) === orig.description) delete site.seo[pg.id]; else { if (m.title === orig.title) delete m.title; if (m.description === orig.description) delete m.description; site.seo[pg.id] = m; } if (!Object.keys(site.seo).length) delete site.seo; mark(); draw(); };
      const t = el('input', { type: 'text' }); t.value = val('title');
      const dsc = el('textarea', { rows: 3 }); dsc.value = val('description');
      const tc = el('span', { class: 'cnt' }), dc = el('span', { class: 'cnt' });
      const serp = el('div', { class: 'serp' }, el('small', {}, 'vbrilliant.com' + (pg.html === 'index.html' ? '' : ' › ' + pg.html.replace('.html', ''))), el('b', {}), el('p', {}));
      const draw = () => {
        const T = t.value.trim(), D = dsc.value.trim();
        tc.textContent = `${T.length} / 60`; tc.classList.toggle('over', T.length > 60);
        dc.textContent = `${D.length} / 160`; dc.classList.toggle('over', D.length > 160);
        serp.querySelector('b').textContent = T || orig.title; serp.querySelector('p').textContent = D || orig.description;
      };
      t.addEventListener('input', () => set('title', t.value)); dsc.addEventListener('input', () => set('description', dsc.value));
      const reset = el('button', { type: 'button', class: 'btn sm ghost', onclick: () => { delete (site.seo || {})[pg.id]; t.value = orig.title; dsc.value = orig.description; if (site.seo && !Object.keys(site.seo).length) delete site.seo; mark(); draw(); } }, 'Як було');
      box.lastChild.replaceWith(el('div', { class: 'grid2' },
        el('div', { class: 'f full' }, el('div', { class: 'lbl' }, el('label', {}, 'Заголовок у Google і на вкладці'), tc), t, el('small', {}, 'До 60 символів, головне — на початку.')),
        el('div', { class: 'f full' }, el('div', { class: 'lbl' }, el('label', {}, 'Опис під заголовком'), dc), dsc, el('small', {}, '120–160 символів: що робите, для кого і чому вам писати.')),
        el('div', { class: 'f full' }, el('div', { class: 'lbl' }, el('span', { class: 'lb' }, 'Як це виглядатиме в Google'), reset), serp)));
      draw();
    }).catch(() => { box.lastChild.textContent = 'Не вдалося завантажити сторінку.'; });
    return box;
  });
  site.analytics = site.analytics || {};
  const ga = el('input', { type: 'text', placeholder: 'G-XXXXXXXXXX' }); ga.value = site.analytics.ga4 || '';
  ga.addEventListener('input', () => { site.analytics.ga4 = ga.value.trim().toUpperCase(); mark(); });
  main.replaceChildren(
    el('div', { class: 'head' }, el('h1', {}, 'SEO')),
    el('p', { style: 'margin:-6px 0 4px;color:var(--mut)' }, 'Заголовки й описи сторінок для Google та прев’ю посилань у месенджерах.'),
    ...secs,
    el('section', { class: 'sec' }, el('h3', {}, 'Аналітика'), el('p', { class: 'hint' }, 'Google Аналітика вже стоїть на всіх сторінках і рахує заявки (generate_lead) та кліки в месенджери.'),
      field('ID потоку Google Аналітики', ga, 'Аналітика → Администратор → Потоки данных → ваш сайт.')));
}

// ---------- history: open any earlier published version, check it, publish it back ----------
async function openHistory() {
  const list = el('div', { class: 'ml' }, el('div', { class: 'empty', style: 'padding:30px' }, 'Завантажую історію…'));
  const close = () => { m.remove(); removeEventListener('keydown', esc); };
  const esc = (e) => { if (e.key === 'Escape') close(); };
  const m = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Історія змін', onclick: (e) => { if (e.target === m) close(); } },
    el('div', { class: 'box' }, el('div', { class: 'mh' }, el('div', {}, el('h3', {}, 'Історія'), el('p', {}, 'Відкрийте версію, перевірте її і натисніть «Опублікувати», щоб повернути на сайт.')), el('button', { type: 'button', class: 'x', 'aria-label': 'Закрити', onclick: () => close() }, '×')), list));
  document.body.append(m); addEventListener('keydown', esc);
  const { ok, d } = await api({ password: pass, action: 'history' }).catch(() => ({ ok: false, d: {} }));
  if (!ok) { list.replaceChildren(el('div', { class: 'empty', style: 'padding:30px' }, d.error || 'Не вдалося завантажити історію')); return; }
  const fmt = (iso) => new Date(iso).toLocaleString('uk-UA', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
  list.replaceChildren(...d.items.map((it, i) => {
    let armed = false;
    const b = el('button', { type: 'button', class: 'btn sm' }, i === 0 ? 'Зараз на сайті' : 'Відкрити');
    if (i === 0) b.disabled = true;
    b.addEventListener('click', async () => {
      if (dirty() && !armed) { armed = true; b.textContent = 'Незбережене зникне. Ще раз'; b.classList.add('danger'); return; }
      b.textContent = 'Відкриваю…';
      const r = await api({ password: pass, action: 'version', sha: it.sha }).catch(() => ({ ok: false, d: {} }));
      if (!r.ok) { toast(r.d.error || 'Не вдалося відкрити версію', true); b.textContent = 'Відкрити'; return; }
      const v = r.d.site; v.projects = v.projects || []; v.reviews = v.reviews || []; v.edits = v.edits || [];
      v.updatedAt = site.updatedAt; site = v; savedEdits = v.edits.length; pending.clear();
      close(); render(); mark(); toast(`Відкрито версію від ${fmt(it.date)}. Перевірте й натисніть «Опублікувати».`);
    });
    return el('div', { class: 'ver' + (i === 0 ? ' now' : '') }, el('div', {}, el('b', {}, fmt(it.date)), el('small', {}, it.message)), b);
  }));
}
$('#hist').addEventListener('click', openHistory);

// ---------- publish ----------
async function api(payload) {
  const r = await fetch('/api/cms-save', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) });
  let d = {}; try { d = await r.json(); } catch (e) {}
  return { ok: r.ok && d.ok, d, status: r.status };
}
$('#pub').addEventListener('click', async () => {
  if (busy) return;
  const files = [...pending.entries()].filter(([p]) => JSON.stringify(site).includes(p)).map(([path, v]) => ({ path, base64: v.base64 }));
  const old = JSON.parse(saved), parts = [];
  const ch = (k) => JSON.stringify(old[k] ?? null) !== JSON.stringify(site[k] ?? null);
  const ne = site.edits.length - savedEdits;
  if (ch('edits')) parts.push(ne > 0 ? `сторінки (${ne})` : 'сторінки');
  if (ch('projects')) parts.push('проєкти'); if (ch('reviews')) parts.push('відгуки');
  if (ch('seo')) parts.push('SEO'); if (ch('analytics')) parts.push('аналітика');
  const body = { password: pass, action: 'save', site, files, message: 'Адмінка: ' + (parts.join(', ') || 'оновлення') };
  const size = JSON.stringify(body).length;
  if (size > 3.8e6) { toast('Забагато нових фото за раз. Опублікуйте частину, потім решту.', true); return; }
  busy = true; mark(); $('#pub').textContent = 'Публікую…';
  try {
    const { ok, d, status } = await api(body);
    if (!ok) { toast(d.error || `Помилка ${status}`, true); if (status === 401) logout(); return; }
    for (const [k, v] of pending) recent.set(k, v);
    pending.clear(); site.updatedAt = d.updatedAt; savedEdits = site.edits.length; saved = JSON.stringify(site); render();
    toast('Опубліковано. Сайт оновиться приблизно за хвилину.');
    waitLive(d.updatedAt);
  } catch (e) { toast('Немає зв’язку. Зміни на місці, спробуйте ще раз.', true); }
  finally { busy = false; $('#pub').textContent = 'Опублікувати'; mark(); }
});
function waitLive(ts) {
  let n = 0; const st = $('#st');
  const tick = async () => {
    n++; if (dirty()) return;
    try { const s = await (await fetch('/content/site.json?t=' + Date.now(), { cache: 'no-store' })).json(); if (s.updatedAt >= ts) { st.textContent = 'Сайт оновлено ✓'; return; } } catch (e) {}
    st.textContent = 'Сайт оновлюється…'; if (n < 40) setTimeout(tick, 6000); else st.textContent = 'Оновлення затримується, перевірте Vercel';
  };
  setTimeout(tick, 8000);
}

// ---------- login ----------
function logout() { pass = ''; store.set('bl-admin', ''); $('#app').hidden = true; $('#login').hidden = false; }
async function enter() {
  const r = await fetch('/content/site.json?t=' + Date.now(), { cache: 'no-store' });
  site = await r.json(); site.projects = site.projects || []; site.reviews = site.reviews || []; site.edits = site.edits || []; savedEdits = site.edits.length;
  try { sessionStorage.setItem('bl-pre', '1'); } catch (e) {}
  saved = JSON.stringify(site); $('#login').hidden = true; $('#app').hidden = false; render(); mark();
}
$('#lf').addEventListener('submit', async (e) => {
  e.preventDefault(); const pw = $('#pw').value; $('#lerr').textContent = '';
  try { const { ok, d } = await api({ password: pw, action: 'check' }); if (!ok) { $('#lerr').textContent = d.error || 'Не вдалося увійти'; return; } pass = pw; store.set('bl-admin', pw); await enter(); }
  catch (err) { $('#lerr').textContent = 'Немає зв’язку із сервером'; }
});
(async () => { if (pass) { try { const { ok } = await api({ password: pass, action: 'check' }); if (ok) return enter(); } catch (e) {} } $('#login').hidden = false; $('#pw').focus(); })();
}
</script>
